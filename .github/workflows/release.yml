name: Auto Release Windows App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Package Windows (.exe)
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Windows Release Files
        shell: pwsh
        run: |
          mkdir -p release-win
          Copy-Item dist/*.exe release-win/
          Get-ChildItem dist/*.exe | ForEach-Object {
            Copy-Item $_.FullName "release-win/ATSIT-Finanzas-Setup-1.1.2.exe" -Force
            Copy-Item $_.FullName "release-win/ATSIT-Finanzas-Setup-1.1.1.exe" -Force
            Copy-Item $_.FullName "release-win/ATSIT-Finanzas-Setup-1.1.0.exe" -Force
            Copy-Item $_.FullName "release-win/ATSIT-Finanzas-Setup-latest.exe" -Force
          }

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATSIT-Finanzas-Windows
          path: release-win/*.exe

  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ATSIT-Finanzas-Windows
          path: release-files

      - name: Create Automatic Release v1.1.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: "ATSIT Finanzas v1.1.2"
          body: "Descargas oficiales verificadas para Windows (.exe). Fijación absoluta del menú lateral (Sidebar 100% estático) y mejoras tributarias."
          files: release-files/*
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Automatic Release v1.1.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: "ATSIT Finanzas v1.1.1"
          body: "Descargas oficiales verificadas para Windows (.exe)."
          files: release-files/*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Automatic Release v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "ATSIT Finanzas v1.1.0"
          body: "Descargas oficiales verificadas para Windows (.exe)."
          files: release-files/*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
