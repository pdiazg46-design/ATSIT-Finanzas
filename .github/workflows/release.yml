name: Auto Release Windows & macOS App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Package Windows (.exe)
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Windows Release Files
        shell: pwsh
        run: |
          mkdir -p release-win
          Copy-Item dist/*.exe release-win/
          Get-ChildItem dist/*.exe | ForEach-Object {
            Copy-Item $_.FullName "release-win/ATSIT-Finanzas-Setup-1.0.0.exe" -Force
            Copy-Item $_.FullName "release-win/ATSIT-Finanzas-Setup-1.0.1.exe" -Force
            Copy-Item $_.FullName "release-win/ATSIT-Finanzas-Setup-1.0.2.exe" -Force
            Copy-Item $_.FullName "release-win/ATSIT.Finanzas.Setup.1.0.0.exe" -Force
          }

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATSIT-Finanzas-Windows
          path: release-win/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Package macOS (.dmg & .zip for Intel and Apple Silicon)
        run: npx electron-builder --mac dmg zip --x64 --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Prepare macOS Release Files
        shell: bash
        run: |
          mkdir -p release-mac
          cp dist/*.zip release-mac/ 2>/dev/null || true
          cp dist/*.dmg release-mac/ 2>/dev/null || true
          # Crear copias con nombres amigables directos para Intel y Apple Silicon
          for f in dist/*-x64.dmg; do
            [ -f "$f" ] && cp "$f" "release-mac/ATSIT-Finanzas-Mac-Intel.dmg" 2>/dev/null || true
          done
          for f in dist/*-arm64.dmg; do
            [ -f "$f" ] && cp "$f" "release-mac/ATSIT-Finanzas-Mac-AppleSilicon.dmg" 2>/dev/null || true
          done

      - name: Upload macOS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATSIT-Finanzas-macOS
          path: release-mac/*

  create-release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ATSIT-Finanzas-Windows
          path: release-files

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ATSIT-Finanzas-macOS
          path: release-files

      - name: Create Automatic Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ATSIT Finanzas v1.0.0"
          body: "Descargas oficiales verificadas para Windows (.exe) y macOS (.zip)."
          files: release-files/*
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Automatic Release v1.0.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "ATSIT Finanzas v1.0.1"
          body: "Descargas oficiales verificadas para Windows (.exe) y macOS (.zip)."
          files: release-files/*
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Automatic Release v1.0.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "ATSIT Finanzas v1.0.2"
          body: "Descargas oficiales verificadas para Windows (.exe) y macOS (.zip)."
          files: release-files/*
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
